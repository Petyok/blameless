# End-to-end stack (runs on gpu-serv, see e2e/run.sh): the production nginx rules and the stats server in front of
# the built game, driven by headless Chromium (software GL).
# Nothing is published on the host. The three containers share one network namespace, so the browser opens
# http://localhost/ (a secure context, as https is in production) and nginx reaches the stats server on 127.0.0.1,
# exactly as deploy/blameless.snippet.conf says.
services:
  web:
    image: nginx:1.24 # production: nginx 1.24.0 (Ubuntu 24.04)
    volumes:
      - ../dist:/var/www/blameless.petruha.ge:ro
      - ../deploy/blameless.snippet.conf:/etc/nginx/snippets/blameless.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  stats:
    image: python:3.12-slim # production: python 3.12.3
    network_mode: service:web
    volumes:
      - ../server:/app:ro
    environment:
      STATE_DIRECTORY: /tmp # a fresh database for every run of the stack
      PYTHONDONTWRITEBYTECODE: "1"
    command: python3 /app/stats.py
  test:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    network_mode: service:web
    depends_on: [web, stats]
    working_dir: /work
    environment:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      SCENARIOS: ${SCENARIOS:-flow,campaign,net}
      BASE: http://localhost/
    volumes:
      - ..:/app:ro
      - ./out:/out
      - deps:/work
    cpus: 8
    mem_limit: 6g
    ipc: host
    command: >
      sh -c "[ -d node_modules/playwright ] || npm i --no-audit --no-fund --silent playwright@1.65.0;
             node /app/e2e/play.mjs"
volumes:
  deps:
