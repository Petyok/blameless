# Body of the blameless.petruha.ge server block. Included by the vhost (deploy/blameless.petruha.ge.conf, on the
# server: /etc/nginx/snippets/blameless.conf) and by the e2e stack (e2e/nginx.conf), so the tests go through the
# same rules as production. deploy.sh uploads it.
root /var/www/blameless.petruha.ge;
index index.html;

# nginx drops these in any location that adds a header of its own, so those locations repeat them
add_header X-Content-Type-Options nosniff always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Referrer-Policy no-referrer always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

gzip on;
gzip_types text/css application/javascript text/javascript application/json;
gzip_min_length 1024;
gzip_static on; # deploy.sh ships .gz files made with gzip -9

location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
}

# music, voice and the link-preview image change only with a deploy
location /assets/ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# world stats and the leaderboard (server/stats.py, systemd unit blameless-stats). A page beats every 20 s and
# reports once per incident, so 2 r/s per address with a burst is plenty.
location /api/ {
    limit_req zone=blameless burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:8789;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri $uri/ =404;
}

location ~ /\. {
    deny all;
}
