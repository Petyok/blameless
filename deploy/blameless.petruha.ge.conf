# blameless.petruha.ge: the game (static files) and its stats API (server/stats.py, systemd unit blameless-stats).
# All rules are in snippets/blameless.conf (deploy/blameless.snippet.conf), which deploy.sh uploads.
# First install: upload this file, link it in sites-enabled, then `certbot --nginx -d blameless.petruha.ge`, which
# adds the 443 and redirect blocks. From then on the copy on the server is the certbot-managed one.
limit_req_zone $binary_remote_addr zone=blameless:1m rate=2r/s;

server {
    server_name blameless.petruha.ge;
    include snippets/blameless.conf;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/blameless.petruha.ge/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blameless.petruha.ge/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = blameless.petruha.ge) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name blameless.petruha.ge;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}